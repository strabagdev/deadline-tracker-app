<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reporting Deadlines Viewer</title>
    <style>
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --border: #e2e8f0;
        --primary: #0f766e;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      .wrap {
        max-width: 1200px;
        margin: 24px auto;
        padding: 0 16px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
      }
      h1 {
        margin: 0 0 12px 0;
        font-size: 20px;
      }
      .muted {
        color: var(--muted);
        font-size: 14px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 14px;
      }
      @media (max-width: 800px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
      label {
        font-size: 12px;
        color: var(--muted);
        display: block;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px;
        font-size: 14px;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        flex-wrap: wrap;
      }
      button {
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 14px;
        cursor: pointer;
      }
      .btn-primary {
        background: var(--primary);
        color: #fff;
      }
      .btn-secondary {
        background: #e2e8f0;
        color: #0f172a;
      }
      .status {
        margin-top: 10px;
        font-size: 14px;
      }
      .table-wrap {
        margin-top: 16px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #fff;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 13px;
      }
      th, td {
        border-bottom: 1px solid var(--border);
        text-align: left;
        padding: 8px 10px;
        white-space: nowrap;
      }
      th {
        position: sticky;
        top: 0;
        background: #f1f5f9;
      }
      pre {
        margin-top: 16px;
        background: #0f172a;
        color: #e2e8f0;
        border-radius: 12px;
        padding: 12px;
        overflow: auto;
        max-height: 350px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Viewer: /api/reporting/deadlines</h1>
        <div class="muted">Consulta el endpoint y visualiza resultado como tabla + JSON.</div>

        <div class="grid">
          <div>
            <label for="baseUrl">Base URL</label>
            <input id="baseUrl" value="http://localhost:3000" />
          </div>
          <div>
            <label for="orgId">organization_id</label>
            <input id="orgId" placeholder="UUID de la organización" />
          </div>
          <div>
            <label for="pbiKey">pbi_key</label>
            <input id="pbiKey" placeholder="REPORTING_EXPORT_KEY / POWERBI_EXPORT_KEY" />
          </div>
        </div>

        <div class="actions">
          <button class="btn-primary" id="btnLoad">Consultar endpoint</button>
          <button class="btn-secondary" id="btnCopy">Copiar URL</button>
        </div>

        <div class="status" id="status"></div>

        <div class="table-wrap">
          <table id="table"></table>
        </div>

        <pre id="json"></pre>
      </div>
    </div>

    <script>
      const baseUrlEl = document.getElementById("baseUrl");
      const orgIdEl = document.getElementById("orgId");
      const pbiKeyEl = document.getElementById("pbiKey");
      const statusEl = document.getElementById("status");
      const tableEl = document.getElementById("table");
      const jsonEl = document.getElementById("json");

      function buildUrl() {
        const base = (baseUrlEl.value || "").replace(/\/$/, "");
        const orgId = encodeURIComponent(orgIdEl.value || "");
        const pbiKey = encodeURIComponent(pbiKeyEl.value || "");
        return `${base}/api/reporting/deadlines?org_id=${orgId}&pbi_key=${pbiKey}`;
      }

      function renderTable(rows) {
        if (!Array.isArray(rows) || rows.length === 0) {
          tableEl.innerHTML = "<thead><tr><th>Sin datos</th></tr></thead>";
          return;
        }
        const cols = Object.keys(rows[0]);
        const head = `<thead><tr>${cols.map((c) => `<th>${c}</th>`).join("")}</tr></thead>`;
        const body = `<tbody>${rows
          .map((r) => `<tr>${cols.map((c) => `<td>${r[c] === null ? "" : String(r[c])}</td>`).join("")}</tr>`)
          .join("")}</tbody>`;
        tableEl.innerHTML = head + body;
      }

      async function loadData() {
        const url = buildUrl();
        statusEl.textContent = "Consultando...";
        tableEl.innerHTML = "";
        jsonEl.textContent = "";
        try {
          const res = await fetch(url);
          const data = await res.json();
          if (!res.ok) {
            statusEl.textContent = `Error ${res.status}: ${data?.error || "No se pudo consultar"}`;
            jsonEl.textContent = JSON.stringify(data, null, 2);
            return;
          }
          statusEl.textContent = `OK. Filas: ${Array.isArray(data) ? data.length : 0}`;
          renderTable(data);
          jsonEl.textContent = JSON.stringify(data, null, 2);
        } catch (err) {
          statusEl.textContent = `Error de red: ${err?.message || err}`;
        }
      }

      document.getElementById("btnLoad").addEventListener("click", loadData);
      document.getElementById("btnCopy").addEventListener("click", async () => {
        const url = buildUrl();
        await navigator.clipboard.writeText(url);
        statusEl.textContent = "URL copiada al portapapeles.";
      });
    </script>
  </body>
</html>
